name: Veille articles

on:
  schedule:
    - cron: "17 * * * *"   # secours : une fois par heure (le rythme de 15 minutes vient de l'horloge Google)
  workflow_dispatch:        # lancé toutes les 15 minutes par l'horloge Google, ou à la main
    inputs:
      test:
        description: "Envoyer seulement une notification de test"
        type: boolean
        default: false

permissions:
  contents: write             # pour enregistrer seen.json dans le dépôt

concurrency:
  group: veille-articles
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 veille.py ${{ inputs.test && '--test' || '' }}

      - name: Enregistrer les articles vus
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add seen.json || exit 0
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
          else
            git commit -m "Veille : mise à jour des articles vus"
            git pull --rebase --autostash
            git push
          fi
