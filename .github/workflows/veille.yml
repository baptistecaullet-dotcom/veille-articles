name: Veille articles

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # toutes les 15 minutes (décalé de l'heure pile, moins encombrée)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # pour enregistrer seen.json dans le dépôt

concurrency:
  group: veille-articles
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 veille.py

      - name: Enregistrer les articles vus
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add seen.json || exit 0
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
          else
            git commit -m "Veille : mise à jour des articles vus"
            git pull --rebase --autostash
            git push
          fi
